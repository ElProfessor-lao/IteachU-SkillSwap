<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>iTeachU - Barter Skills, Build Community</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .app-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: white;
            border-radius: 20px;
            padding: 20px 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo h1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 28px;
        }

        .logo p {
            font-size: 12px;
            color: #666;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .reputation {
            background: #f0f0f0;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            color: #667eea;
        }

        .btn-logout, .btn-login {
            padding: 8px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .btn-logout:hover, .btn-login:hover { opacity: 0.9; transform: scale(0.98); }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 12px 24px;
            background: rgba(255,255,255,0.9);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .tab.active {
            background: white;
            color: #667eea;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .skill-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .skill-card:hover {
            transform: translateY(-5px);
        }

        .skill-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .skill-title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .skill-category {
            background: #667eea20;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 12px;
            color: #667eea;
        }

        .skill-description {
            color: #666;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .skill-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #eee;
            padding-top: 15px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-primary, .btn-success, .btn-warning {
            padding: 8px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            color: white;
        }

        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .btn-success { background: #51cf66; }
        .btn-warning { background: #ff9f43; }

        .swipe-container {
            background: white;
            border-radius: 30px;
            padding: 30px;
            max-width: 500px;
            margin: 0 auto;
            text-align: center;
        }

        .swipe-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 20px;
            min-height: 350px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .swipe-actions {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .swipe-btn {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .swipe-btn.no { background: #ff6b6b; color: white; }
        .swipe-btn.yes { background: #51cf66; color: white; }
        .swipe-btn:hover { transform: scale(1.05); }

        .form-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
        }

        .badge {
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge.pending { background: #ffd93d; color: #8b6b00; }
        .badge.confirmed { background: #51cf66; color: #1e4620; }
        .badge.scheduled { background: #ff9f43; color: #5e3a1a; }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 10px;
            color: white;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .chat-container {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 400px;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .message-bubble {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        .message-bubble.sent { align-items: flex-end; }
        .message-bubble.received { align-items: flex-start; }
        .message-content {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 18px;
            word-wrap: break-word;
        }
        .message-bubble.sent .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .message-bubble.received .message-content {
            background: #f0f0f0;
            color: #333;
        }
        .chat-input {
            display: flex;
            padding: 15px;
            border-top: 1px solid #eee;
            gap: 10px;
        }
        .chat-input input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
        }
        .section-title {
            margin: 20px 0 15px 0;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }
        @media (max-width: 768px) {
            .app-container { padding: 10px; }
            .cards-container { grid-template-columns: 1fr; }
        }
        .hidden { display: none; }
        .auth-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            background: white;
            border-radius: 30px;
            padding: 40px;
            max-width: 420px;
            width: 90%;
            text-align: center;
        }
        .toggle-auth {
            color: #667eea;
            cursor: pointer;
            margin-top: 15px;
            display: inline-block;
        }
    </style>
</head>
<body>
<div class="app-container" id="appContainer">
    <div class="header">
        <div class="logo"><h1>📚 iTeachU</h1><p>Barter skills, build community</p></div>
        <div class="user-info" id="userInfoHeader">
            <div class="reputation" id="reputationDisplay">⭐ 0 | 0 trades</div>
            <button class="btn-logout" id="authButton">Login / Signup</button>
        </div>
    </div>
    <div class="tabs" id="mainTabs" style="display: none;">
        <button class="tab active" data-tab="swipe">🔍 Discover</button>
        <button class="tab" data-tab="matches">💕 Matches <span id="matchCount">(0)</span></button>
        <button class="tab" data-tab="sessions">📅 Sessions <span id="sessionCount">(0)</span></button>
        <button class="tab" data-tab="debt">💰 Debt</button>
        <button class="tab" data-tab="addskill">+ Add Skill</button>
    </div>
    <div id="swipeTab"></div><div id="matchesTab" class="hidden"></div>
    <div id="sessionsTab" class="hidden"></div><div id="debtTab" class="hidden"></div>
    <div id="addSkillTab" class="hidden"></div>
</div>
<div id="messageContainer"></div><div id="modalContainer"></div>

<script>
    // Storage keys
    const STORAGE_USERS = "iteachu_users";
    const STORAGE_CURRENT_USER = "iteachu_current_user";
    
    function loadUsers() {
        const raw = localStorage.getItem(STORAGE_USERS);
        if (!raw) {
            const defaultUsers = [
                { id: "u1", username: "Sarah", email: "sarah@example.com", password: "pass123", reputation: 38, completedTrades: 8, givenHours: 12, receivedHours: 10, userSkills: [{ id: "s1", title: "Guitar", category: "Music", description: "Acoustic guitar lessons for beginners" }] },
                { id: "u2", username: "Mike", email: "mike@example.com", password: "pass123", reputation: 25, completedTrades: 5, givenHours: 6, receivedHours: 7, userSkills: [{ id: "s2", title: "Spanish", category: "Language", description: "Conversational Spanish" }] },
                { id: "u3", username: "Emma", email: "emma@example.com", password: "pass123", reputation: 52, completedTrades: 12, givenHours: 18, receivedHours: 15, userSkills: [{ id: "s3", title: "Yoga", category: "Fitness", description: "Beginner yoga classes" }] }
            ];
            localStorage.setItem(STORAGE_USERS, JSON.stringify(defaultUsers));
            return defaultUsers;
        }
        return JSON.parse(raw);
    }
    
    function saveUsers(users) { 
        localStorage.setItem(STORAGE_USERS, JSON.stringify(users)); 
    }
    
    function getCurrentUser() {
        const curr = localStorage.getItem(STORAGE_CURRENT_USER);
        if (!curr) return null;
        try {
            const parsed = JSON.parse(curr);
            const users = loadUsers();
            return users.find(u => u.id === parsed.id) || null;
        } catch(e) { return null; }
    }
    
    function setCurrentUser(user) {
        if (!user) { 
            localStorage.removeItem(STORAGE_CURRENT_USER); 
            return; 
        }
        localStorage.setItem(STORAGE_CURRENT_USER, JSON.stringify({ id: user.id, username: user.username }));
    }
    
    // Global state
    let matchesStore = [];
    let sessionsStore = [];
    let messagesStore = {};
    let availableSkillsCache = [];
    let currentSwipeIndex = 0;
    let selectedMatch = null;
    
    function loadUserData(userId) {
        const keyMatches = `iteachu_matches_${userId}`;
        const keySessions = `iteachu_sessions_${userId}`;
        const keyMessages = `iteachu_msgs_${userId}`;
        matchesStore = JSON.parse(localStorage.getItem(keyMatches) || '[]');
        sessionsStore = JSON.parse(localStorage.getItem(keySessions) || '[]');
        messagesStore = JSON.parse(localStorage.getItem(keyMessages) || '{}');
    }
    
    function saveUserData(userId) {
        localStorage.setItem(`iteachu_matches_${userId}`, JSON.stringify(matchesStore));
        localStorage.setItem(`iteachu_sessions_${userId}`, JSON.stringify(sessionsStore));
        localStorage.setItem(`iteachu_msgs_${userId}`, JSON.stringify(messagesStore));
    }
    
    // Get all skills from other users
    function getAvailableSkills(currentUserId, allUsers) {
        const others = allUsers.filter(u => u.id !== currentUserId);
        const skills = [];
        others.forEach(user => {
            (user.userSkills || []).forEach(skill => {
                // Don't show skills that already have a pending outgoing request from current user
                const alreadyRequested = matchesStore.some(m => 
                    m.is_sender === true && 
                    m.status === 'pending' && 
                    m.partnerId === user.id && 
                    m.theirSkillId === skill.id
                );
                // Also don't show if already confirmed match
                const alreadyConfirmed = matchesStore.some(m => 
                    m.status === 'confirmed' && 
                    ((m.partnerId === user.id && m.theirSkillId === skill.id) ||
                     (m.is_sender === false && m.yourSkillId === skill.id))
                );
                if (!alreadyRequested && !alreadyConfirmed) {
                    skills.push({
                        id: `${user.id}_${skill.id}`,
                        skillId: skill.id,
                        title: skill.title,
                        category: skill.category,
                        description: skill.description,
                        user: { 
                            username: user.username, 
                            reputation: user.reputation, 
                            userId: user.id, 
                            email: user.email,
                            phone: "+1 555-000-0000"
                        }
                    });
                }
            });
        });
        return skills;
    }
    
    function refreshAvailableSkills() {
        const user = getCurrentUser();
        if (user) {
            const allUsers = loadUsers();
            availableSkillsCache = getAvailableSkills(user.id, allUsers);
            // Reset index if needed
            if (currentSwipeIndex >= availableSkillsCache.length && availableSkillsCache.length > 0) {
                currentSwipeIndex = 0;
            }
        }
    }
    
    function showMessage(msg, type='success') {
        const container = document.getElementById('messageContainer');
        const div = document.createElement('div');
        div.className = 'message';
        div.style.background = type === 'success' ? '#51cf66' : '#ff6b6b';
        div.textContent = msg;
        container.appendChild(div);
        setTimeout(() => div.remove(), 3000);
    }
    
    function closeModal() { document.getElementById('modalContainer').innerHTML = ''; }
    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
    
    function renderSwipeTab() {
        const container = document.getElementById('swipeTab');
        const user = getCurrentUser();
        if (!user || !user.userSkills || user.userSkills.length === 0) {
            container.innerHTML = `<div class="swipe-container"><div class="swipe-card"><h3>📝 Add a skill first!</h3><p>You need to add a skill you can teach before you can learn from others.</p><button class="btn-primary" onclick="switchTabManual('addskill')" style="margin-top:20px">+ Add Your First Skill</button></div></div>`;
            return;
        }
        if (!availableSkillsCache.length) {
            container.innerHTML = `<div class="swipe-container"><div class="swipe-card"><h3>✨ No skills available</h3><p>Other users haven't added skills yet. Check back later!</p><p style="margin-top:15px">💡 Tip: Create another account to test swapping!</p></div></div>`;
            return;
        }
        const skill = availableSkillsCache[currentSwipeIndex % availableSkillsCache.length];
        container.innerHTML = `<div class="swipe-container"><div class="swipe-card"><h2 style="margin-bottom:15px">🎯 ${escapeHtml(skill.title)}</h2><span class="skill-category">${escapeHtml(skill.category)}</span><p style="margin-top:20px">${escapeHtml(skill.description)}</p><div style="margin-top:20px; padding-top:20px; border-top:1px solid rgba(0,0,0,0.1)"><p>👤 Offered by: ${escapeHtml(skill.user.username)}</p><p>⭐ Reputation: ${skill.user.reputation}</p></div></div><div class="swipe-actions"><button class="swipe-btn no" onclick="handlePass()">👎 Pass</button><button class="swipe-btn yes" onclick="handleSwipe('${skill.id}')">👍 I Want to Learn This</button></div></div>`;
    }
    
    function handlePass() { 
        if (availableSkillsCache.length > 0) {
            currentSwipeIndex = (currentSwipeIndex + 1) % availableSkillsCache.length; 
            renderSwipeTab();
        }
    }
    
    function handleSwipe(skillId) {
        const skill = availableSkillsCache.find(s => s.id === skillId);
        if (!skill) return;
        const currentUser = getCurrentUser();
        if (!currentUser || !currentUser.userSkills.length) { 
            showMessage("Add a teaching skill first", "error"); 
            return; 
        }
        
        // Use the first skill the user has as their teaching skill
        const yourSkill = currentUser.userSkills[0];
        
        const newMatch = {
            id: Date.now(),
            status: 'pending',
            partnerId: skill.user.userId,
            partnerUsername: skill.user.username,
            partnerEmail: skill.user.email,
            partnerPhone: skill.user.phone || "+1 555-000-0000",
            partnerReputation: skill.user.reputation,
            yourSkill: yourSkill,
            yourSkillId: yourSkill.id,
            theirSkill: { title: skill.title, category: skill.category, description: skill.description },
            theirSkillId: skill.skillId,
            is_sender: true
        };
        
        matchesStore.push(newMatch);
        saveUserData(currentUser.id);
        
        // Also add to the receiving user's matches (so they see pending request)
        const allUsers = loadUsers();
        const receiverUser = allUsers.find(u => u.id === skill.user.userId);
        if (receiverUser) {
            const receiverMatchesKey = `iteachu_matches_${receiverUser.id}`;
            let receiverMatches = JSON.parse(localStorage.getItem(receiverMatchesKey) || '[]');
            
            // Check if already exists
            const exists = receiverMatches.some(m => m.id === newMatch.id);
            if (!exists) {
                receiverMatches.push({
                    id: newMatch.id,
                    status: 'pending',
                    partnerId: currentUser.id,
                    partnerUsername: currentUser.username,
                    partnerEmail: currentUser.email,
                    partnerPhone: "+1 555-000-0000",
                    partnerReputation: currentUser.reputation || 10,
                    yourSkill: { title: skill.title, category: skill.category, description: skill.description },
                    yourSkillId: skill.skillId,
                    theirSkill: yourSkill,
                    theirSkillId: yourSkill.id,
                    is_sender: false
                });
                localStorage.setItem(receiverMatchesKey, JSON.stringify(receiverMatches));
            }
        }
        
        showMessage(`✓ Interest sent to ${skill.user.username}! They can accept in their Matches tab.`, 'success');
        
        // Remove the swiped skill from cache and refresh
        availableSkillsCache = availableSkillsCache.filter(s => s.id !== skillId);
        if (availableSkillsCache.length === 0) {
            currentSwipeIndex = 0;
        } else if (currentSwipeIndex >= availableSkillsCache.length) {
            currentSwipeIndex = 0;
        }
        renderSwipeTab();
        
        // Refresh matches tab if it's visible
        if (document.querySelector('.tab.active')?.getAttribute('data-tab') === 'matches') {
            renderMatchesTab();
        }
        refreshCounters();
    }
    
    function renderMatchesTab() {
        const container = document.getElementById('matchesTab');
        const pendingIncoming = matchesStore.filter(m => m.status === 'pending' && !m.is_sender);
        const pendingOutgoing = matchesStore.filter(m => m.status === 'pending' && m.is_sender);
        const confirmed = matchesStore.filter(m => m.status === 'confirmed');
        
        if (matchesStore.length === 0) { 
            container.innerHTML = `<div class="form-container"><h3 style="text-align:center">💕 No matches yet</h3><p style="text-align:center">Go to Discover tab and swipe right on skills you want to learn!</p></div>`; 
            return; 
        }
        
        let html = '';
        
        if(pendingIncoming.length) { 
            html += `<h3 class="section-title" style="color:#ff9f43">📨 Incoming Requests (${pendingIncoming.length})</h3><div class="cards-container">`; 
            pendingIncoming.forEach(m => { 
                html += `<div class="skill-card"><div class="skill-header"><div class="skill-title">🎓 ${escapeHtml(m.theirSkill.title)}</div><span class="badge pending">Awaiting Your Response</span></div><p><strong>${escapeHtml(m.partnerUsername)}</strong> wants to learn your <strong>${escapeHtml(m.yourSkill.title)}</strong> in exchange for teaching you <strong>${escapeHtml(m.theirSkill.title)}</strong></p><div style="margin-top:10px; padding:10px; background:#f8f9fa; border-radius:10px"><p>⭐ Partner reputation: ${m.partnerReputation}</p><p>📧 ${escapeHtml(m.partnerEmail)}</p></div><div class="skill-footer"><button class="btn-success" onclick="confirmMatch(${m.id})">✅ Accept & Match</button><button class="btn-primary" onclick="openChat(${m.id})">💬 Message</button></div></div>`; 
            }); 
            html+=`</div>`; 
        }
        
        if(pendingOutgoing.length) { 
            html += `<h3 class="section-title" style="color:#667eea">📤 Sent Requests (${pendingOutgoing.length})</h3><div class="cards-container">`; 
            pendingOutgoing.forEach(m => { 
                html += `<div class="skill-card"><div class="skill-header"><div class="skill-title">🎯 ${escapeHtml(m.theirSkill.title)}</div><span class="badge pending">Waiting for Response</span></div><p>You want to learn ${escapeHtml(m.theirSkill.title)} from ${escapeHtml(m.partnerUsername)}</p><p style="margin-top:5px; font-size:14px; color:#666">You offered to teach: ${escapeHtml(m.yourSkill.title)}</p><div class="skill-footer"><button class="btn-primary" onclick="openChat(${m.id})">💬 Message</button></div></div>`; 
            }); 
            html+=`</div>`; 
        }
        
        if(confirmed.length) { 
            html += `<h3 class="section-title" style="color:#51cf66">✅ Confirmed Matches (${confirmed.length})</h3><div class="cards-container">`; 
            confirmed.forEach(m => { 
                html += `<div class="skill-card"><div class="skill-header"><div class="skill-title">🔄 ${escapeHtml(m.yourSkill.title)} ⇄ ${escapeHtml(m.theirSkill.title)}</div><span class="badge confirmed">Confirmed</span></div><p>With ${escapeHtml(m.partnerUsername)} (⭐ ${m.partnerReputation})</p><div class="skill-footer"><button class="btn-primary" onclick="openChat(${m.id})">💬 Chat</button><button class="btn-warning" onclick="openSchedule(${m.id})">📅 Schedule Session</button></div></div>`; 
            }); 
            html+=`</div>`; 
        }
        container.innerHTML = html;
        document.getElementById('matchCount').innerHTML = `(${matchesStore.length})`;
    }
    
    function confirmMatch(matchId) {
        const match = matchesStore.find(m => m.id === matchId);
        if(match) { 
            match.status = 'confirmed'; 
            saveUserData(getCurrentUser().id);
            
            // Update the sender's match status as well
            const allUsers = loadUsers();
            const senderUser = allUsers.find(u => u.id === match.partnerId);
            if (senderUser) {
                const senderMatchesKey = `iteachu_matches_${senderUser.id}`;
                let senderMatches = JSON.parse(localStorage.getItem(senderMatchesKey) || '[]');
                const senderMatch = senderMatches.find(m => m.id === matchId);
                if (senderMatch) {
                    senderMatch.status = 'confirmed';
                    localStorage.setItem(senderMatchesKey, JSON.stringify(senderMatches));
                }
            }
            
            showMessage('✓ Match confirmed! You can now schedule a session.','success'); 
            renderMatchesTab(); 
            refreshCounters(); 
            
            // Refresh available skills to remove matched skills
            refreshAvailableSkills();
        }
    }
    
    function openChat(matchId) {
        selectedMatch = matchesStore.find(m => m.id === matchId);
        if(!selectedMatch) return;
        let msgs = messagesStore[matchId] || [];
        
        function renderChatModalInner() {
            let messagesHtml = ''; 
            msgs.forEach(m => { 
                messagesHtml += `<div class="message-bubble ${m.is_sent ? 'sent' : 'received'}"><div class="message-content">${escapeHtml(m.content)}</div><div style="font-size:10px; margin-top:4px; color:#888">${new Date(m.timestamp).toLocaleTimeString()}</div></div>`; 
            });
            if (messagesHtml === '') {
                messagesHtml = '<div style="text-align:center; color:#999; padding:20px">No messages yet. Start the conversation!</div>';
            }
            const modalHtml = `<div class="modal" onclick="closeModal()"><div class="modal-content" onclick="event.stopPropagation()"><h2>💬 Chat with ${escapeHtml(selectedMatch.partnerUsername)}</h2><div class="chat-container"><div class="chat-messages" id="chatMessages">${messagesHtml}<div id="chatEnd"></div></div><div class="chat-input"><input type="text" id="chatInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendChatMessageCurrent()"><button class="btn-primary" onclick="sendChatMessageCurrent()">Send</button></div></div><button class="btn-primary" onclick="closeModal()" style="background:#999; margin-top:15px">Close</button></div></div>`;
            document.getElementById('modalContainer').innerHTML = modalHtml;
            setTimeout(() => {
                const end = document.getElementById('chatEnd');
                if (end) end.scrollIntoView({ behavior: 'smooth' });
            }, 100);
            
            window.sendChatMessageCurrent = function() {
                const input = document.getElementById('chatInput');
                if(input && input.value.trim()) {
                    const newMsg = { id: Date.now(), content: input.value, is_sent: true, timestamp: new Date().toISOString() };
                    msgs.push(newMsg);
                    messagesStore[matchId] = msgs;
                    saveUserData(getCurrentUser().id);
                    renderChatModalInner();
                    input.value = '';
                }
            };
        }
        renderChatModalInner();
    }
    
    function openSchedule(matchId) {
        const match = matchesStore.find(m => m.id === matchId);
        const modalHtml = `<div class="modal" onclick="closeModal()"><div class="modal-content" onclick="event.stopPropagation()"><h2>📅 Schedule with ${escapeHtml(match.partnerUsername)}</h2><div style="margin-bottom:15px; padding:10px; background:#f0f0f0; border-radius:10px"><p>🤝 You teach: <strong>${escapeHtml(match.yourSkill.title)}</strong></p><p>📚 You learn: <strong>${escapeHtml(match.theirSkill.title)}</strong></p></div><div class="form-group"><label>Date *</label><input type="date" id="scheduleDate"></div><div class="form-group"><label>Time *</label><input type="time" id="scheduleTime"></div><div class="form-group"><label>Location / Meeting Link</label><input type="text" id="scheduleLocation" placeholder="Zoom link, coffee shop, library, etc."></div><div class="form-group"><label>Notes</label><textarea id="scheduleNotes" rows="2" placeholder="What to bring, specific topics..."></textarea></div><div style="display:flex; gap:10px"><button class="btn-success" onclick="scheduleSessionFromModal(${matchId})">✅ Schedule</button><button class="btn-primary" onclick="closeModal()">Cancel</button></div></div></div>`;
        document.getElementById('modalContainer').innerHTML = modalHtml;
    }
    
    function scheduleSessionFromModal(matchId) {
        const date = document.getElementById('scheduleDate')?.value;
        const time = document.getElementById('scheduleTime')?.value;
        if(!date || !time) { showMessage('Please select date & time','error'); return; }
        const match = matchesStore.find(m => m.id === matchId);
        if(match) {
            const newSession = { 
                id: Date.now(), 
                status: 'scheduled', 
                partner: { username: match.partnerUsername }, 
                yourSkill: match.yourSkill.title, 
                theirSkill: match.theirSkill.title, 
                scheduled_time: `${date} at ${time}`, 
                location: document.getElementById('scheduleLocation')?.value || 'TBD', 
                notes: document.getElementById('scheduleNotes')?.value || '' 
            };
            sessionsStore.push(newSession);
            saveUserData(getCurrentUser().id);
            showMessage('✓ Session scheduled! Check your Sessions tab.','success');
            closeModal();
            refreshAllUserData();
        }
    }
    
    function renderSessionsTab() {
        const container = document.getElementById('sessionsTab');
        if(!sessionsStore.length) { 
            container.innerHTML = `<div class="form-container"><h3>📅 No sessions yet</h3><p>Go to your confirmed matches and click "Schedule Session" to set up a meeting!</p></div>`; 
            return; 
        }
        let html = '<h2 class="section-title">Your Upcoming Sessions</h2><div class="cards-container">';
        sessionsStore.forEach(s => { 
            html += `<div class="skill-card"><div class="skill-header"><div class="skill-title">👥 With ${escapeHtml(s.partner.username)}</div><span class="badge ${s.status}">${s.status}</span></div><p>🤝 You teach: ${escapeHtml(s.yourSkill)}</p><p>📚 You learn: ${escapeHtml(s.theirSkill)}</p><p style="font-weight:bold;margin:10px 0; color:#667eea">📅 ${escapeHtml(s.scheduled_time)}</p>${s.location ? `<p>📍 ${escapeHtml(s.location)}</p>` : ''}${s.notes ? `<p>📝 ${escapeHtml(s.notes)}</p>` : ''}<div class="skill-footer"><button class="btn-success" onclick="completeSession(${s.id})">✓ Mark as Completed</button></div></div>`; 
        });
        html += '</div>'; 
        container.innerHTML = html;
        document.getElementById('sessionCount').innerHTML = `(${sessionsStore.length})`;
    }
    
    function completeSession(id) { 
        showMessage('✓ Session completed! Reputation points added. Keep learning!','success'); 
    }
    
    function renderDebtTab() {
        const user = getCurrentUser();
        const given = user?.givenHours || 0, received = user?.receivedHours || 0, balance = given - received;
        const container = document.getElementById('debtTab');
        container.innerHTML = `<div class="form-container"><h2>💰 Skill Debt Tracker</h2><div style="text-align:center;padding:20px;background:#f8f9fa;border-radius:15px;margin-bottom:20px"><h3>Your Balance</h3><p style="font-size:48px;font-weight:bold;color:${balance>=0?'#51cf66':'#ff6b6b'}">${balance} hours</p><p>${balance>=0?'✨ You\'ve taught more than you\'ve learned! 🌟':'📚 You\'ve learned more than you\'ve taught — keep sharing!'}</p></div><div style="background:white; border-radius:15px; padding:15px"><p style="margin:10px 0">✅ Hours taught: ${given}</p><p style="margin:10px 0">📖 Hours learned: ${received}</p><p style="margin:10px 0">🤝 Total completed trades: ${user?.completedTrades||0}</p><p style="margin:10px 0">⭐ Reputation score: ${user?.reputation||0}/100</p></div><p style="margin-top:15px; font-size:12px; color:#666; text-align:center">💡 Each completed trade increases your reputation!</p></div>`;
    }
    
    function renderAddSkillTab() {
        const container = document.getElementById('addSkillTab');
        container.innerHTML = `<div class="form-container"><h3>✨ Add a Skill You Can Teach</h3><p style="margin-bottom:20px; color:#666">Share your knowledge with the community!</p><div class="form-group"><input id="newSkillTitle" placeholder="Skill Title * (e.g., Python, Guitar, Cooking)"></div><div class="form-group"><select id="newSkillCat"><option value="">Select Category *</option><option>Programming</option><option>Music</option><option>Language</option><option>Fitness</option><option>Art</option><option>Business</option><option>Other</option></select></div><div class="form-group"><textarea id="newSkillDesc" rows="3" placeholder="Description - what will students learn?"></textarea></div><div style="display:flex; gap:10px"><button class="btn-primary" onclick="addNewSkillSubmit()">➕ Add Skill</button><button class="btn-primary" onclick="switchTabManual('swipe')" style="background:#999">Cancel</button></div></div>`;
    }
    
    function addNewSkillSubmit() {
        const title = document.getElementById('newSkillTitle')?.value.trim();
        const cat = document.getElementById('newSkillCat')?.value;
        if(!title || !cat) { showMessage('Please fill in title and category','error'); return; }
        const user = getCurrentUser();
        const newSkill = { id: Date.now().toString(), title: title, category: cat, description: document.getElementById('newSkillDesc')?.value.trim() || 'No description provided' };
        user.userSkills = user.userSkills || [];
        user.userSkills.push(newSkill);
        const allUsers = loadUsers();
        const index = allUsers.findIndex(u => u.id === user.id);
        if(index !== -1) allUsers[index] = user;
        saveUsers(allUsers);
        setCurrentUser(user);
        showMessage(`✓ "${title}" added! Now others can discover your skill and request to learn from you.`,'success');
        refreshAllUserData();
        switchTabManual('swipe');
    }
    
    function refreshAllUserData() {
        const user = getCurrentUser();
        if(user) { 
            loadUserData(user.id); 
            refreshAvailableSkills();
        }
        const activeTab = document.querySelector('.tab.active')?.getAttribute('data-tab');
        if(activeTab === 'swipe') renderSwipeTab();
        else if(activeTab === 'matches') renderMatchesTab();
        else if(activeTab === 'sessions') renderSessionsTab();
        else if(activeTab === 'debt') renderDebtTab();
        else if(activeTab === 'addskill') renderAddSkillTab();
        refreshCounters();
    }
    
    function refreshCounters() { 
        document.getElementById('matchCount').innerHTML = `(${matchesStore.length})`; 
        document.getElementById('sessionCount').innerHTML = `(${sessionsStore.length})`; 
        const user=getCurrentUser(); 
        if(user) document.getElementById('reputationDisplay').innerHTML = `⭐ ${user.reputation} | ${user.completedTrades||0} trades`; 
    }
    
    function switchTabManual(tabName) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        const targetBtn = Array.from(document.querySelectorAll('.tab')).find(b => b.getAttribute('data-tab') === tabName);
        if(targetBtn) targetBtn.classList.add('active');
        document.getElementById('swipeTab').classList.add('hidden'); 
        document.getElementById('matchesTab').classList.add('hidden');
        document.getElementById('sessionsTab').classList.add('hidden'); 
        document.getElementById('debtTab').classList.add('hidden');
        document.getElementById('addSkillTab').classList.add('hidden');
        
        if(tabName === 'swipe') { 
            document.getElementById('swipeTab').classList.remove('hidden'); 
            renderSwipeTab(); 
        }
        else if(tabName === 'matches') { 
            document.getElementById('matchesTab').classList.remove('hidden'); 
            renderMatchesTab(); 
        }
        else if(tabName === 'sessions') { 
            document.getElementById('sessionsTab').classList.remove('hidden'); 
            renderSessionsTab(); 
        }
        else if(tabName === 'debt') { 
            document.getElementById('debtTab').classList.remove('hidden'); 
            renderDebtTab(); 
        }
        else if(tabName === 'addskill') { 
            document.getElementById('addSkillTab').classList.remove('hidden'); 
            renderAddSkillTab(); 
        }
    }
    
    function logout() {
        setCurrentUser(null);
        // Don't clear all localStorage, just remove the current user session
        showMessage('Logged out successfully', 'success');
        location.reload();
    }
    
    function initAuthUI() {
        const user = getCurrentUser();
        if(user) {
            document.getElementById('mainTabs').style.display = 'flex';
            document.getElementById('authButton').innerText = `Logout (${user.username})`;
            document.getElementById('authButton').onclick = logout;
            loadUserData(user.id);
            refreshAvailableSkills();
            refreshCounters();
            switchTabManual('swipe');
        } else {
            document.getElementById('mainTabs').style.display = 'none';
            document.getElementById('authButton').innerText = 'Login / Signup';
            document.getElementById('authButton').onclick = showAuthModal;
            showAuthModal();
        }
    }
    
    function showAuthModal() {
        const modalHtml = `<div class="auth-overlay" id="authOverlay"><div class="auth-card"><h2>📚 Welcome to iTeachU</h2><p>Learn skills. Teach skills. Build community.</p><div id="authForm"><div class="form-group"><input type="text" id="authUsername" placeholder="Username"></div><div class="form-group"><input type="email" id="authEmail" placeholder="Email"></div><div class="form-group"><input type="password" id="authPassword" placeholder="Password"></div><button class="btn-primary" id="authActionBtn">Sign Up</button><p><span id="toggleAuthText" class="toggle-auth">Already have an account? Login</span></p><hr><p style="font-size:12px; color:#888">Demo accounts: sarah@example.com / pass123 | mike@example.com / pass123 | emma@example.com / pass123</p></div></div></div>`;
        document.getElementById('modalContainer').innerHTML = modalHtml;
        let isLogin = false;
        const btn = document.getElementById('authActionBtn');
        const toggle = document.getElementById('toggleAuthText');
        const updateForm = () => { 
            btn.innerText = isLogin ? 'Login' : 'Sign Up'; 
            toggle.innerText = isLogin ? "Need an account? Sign up" : "Already have an account? Login"; 
        };
        updateForm();
        btn.onclick = () => {
            const username = document.getElementById('authUsername').value.trim();
            const email = document.getElementById('authEmail').value.trim();
            const pwd = document.getElementById('authPassword').value.trim();
            let users = loadUsers();
            if(isLogin) {
                const found = users.find(u => (u.email === email || u.username === username) && u.password === pwd);
                if(found) { 
                    setCurrentUser(found); 
                    closeModal(); 
                    location.reload(); 
                } else showMessage("Invalid email/password", "error");
            } else {
                if(!username || !email || !pwd) { showMessage("All fields required","error"); return; }
                if(users.find(u=>u.email===email)) { showMessage("Email already exists","error"); return; }
                const newUser = { 
                    id: "u"+Date.now(), 
                    username: username, 
                    email: email, 
                    password: pwd, 
                    reputation: 10, 
                    completedTrades: 0, 
                    givenHours: 0, 
                    receivedHours: 0, 
                    userSkills: [] 
                };
                users.push(newUser); 
                saveUsers(users); 
                setCurrentUser(newUser); 
                closeModal(); 
                location.reload();
            }
        };
        toggle.onclick = () => { isLogin = !isLogin; updateForm(); };
    }
    
    // Make functions global for HTML onclick
    window.handlePass = handlePass; 
    window.handleSwipe = handleSwipe; 
    window.confirmMatch = confirmMatch; 
    window.openChat = openChat; 
    window.openSchedule = openSchedule; 
    window.completeSession = completeSession; 
    window.scheduleSessionFromModal = scheduleSessionFromModal; 
    window.addNewSkillSubmit = addNewSkillSubmit; 
    window.switchTabManual = switchTabManual; 
    window.showAuthModal = showAuthModal;
    
    // Attach tab listeners
    document.querySelectorAll('.tab').forEach(tab => { 
        tab.addEventListener('click', (e) => { 
            switchTabManual(tab.getAttribute('data-tab')); 
        }); 
    });
    
    initAuthUI();
</script>
</body>
</html>
